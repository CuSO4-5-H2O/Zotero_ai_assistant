<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文献精读 · 科研笔记仓库</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/reader.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><script defer src="/vendor/katex/katex.min.js"></script><script defer src="/shared.js"></script><script defer src="/ai-settings.js"></script><script defer src="/paper.js"></script></head>
<body class="paper-window"><header class="paper-top"><a href="/" target="_blank" rel="noopener" class="paper-brand">研 · 科研笔记仓库</a><span>文献精读</span><button data-deepseek-settings class="secondary">DeepSeek 设置</button></header>
<div class="paper-layout"><aside class="paper-sidebar"><div id="paper-id" class="paper-kicker"></div><h2>阅读路径</h2><nav id="paper-tabs"><button data-tab="guide" class="active">01　导读与创新点</button><button data-tab="source">02　论文全文</button><button data-tab="reading">03　文献笔记</button></nav><hr><a id="paper-original" target="_blank" rel="noopener" class="secondary">打开论文原文 ↗</a><button id="paper-pdf" type="button" class="secondary" hidden>打开 PDF ↗</button><button id="import-pdf" class="secondary">导入 PDF 到 Zotero storage</button><input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden><p id="pdf-help" class="muted">上传的 PDF 将由 Zotero 原生托管到当前 Zotero 数据目录/storage；Zotero 会在 storage 下按附件 key 建子目录，笔记仓库只保留文字索引和笔记。</p><div id="pdf-status" role="status"></div><div id="page-links"></div></aside>
<main class="paper-main"><header class="paper-heading"><h1 id="paper-title">正在打开文献…</h1><p id="paper-meta"></p><div id="paper-badges"></div></header>
<section id="guide-view" class="paper-view"><article id="paper-guide" class="prose selectable"></article></section>
<section id="source-view" class="paper-view" hidden><div class="paper-section-head"><h2>论文全文 · 可选中文字</h2><span id="page-count"></span></div><p id="source-message" class="muted"></p><div class="paper-find"><label>查找原文<input id="paper-find" type="search" placeholder="输入关键词定位段落" aria-label="查找论文全文"></label><span id="find-count"></span></div><div id="paper-pages" class="selectable"></div></section>
<section id="reading-view" class="paper-view" hidden><div class="paper-section-head"><h2>文献笔记</h2><div><button id="generate-reading" class="secondary">生成独立导读</button><button id="toggle-reading-edit" class="secondary">编辑笔记</button><button id="save-reading" class="primary" hidden>保存笔记</button></div></div><p id="analysis-notice" class="muted">AI 精读会将本篇 PDF 的全部文字发送至 DeepSeek。生成结果写入独立导读，不会添加到个人文献笔记；已有导读保留历史版本。</p><p id="reading-status" role="status"></p><textarea id="reading-editor" aria-label="文献笔记编辑器" spellcheck="false" hidden></textarea><article id="paper-reading" class="prose selectable"></article><div id="reading-history"></div></section>
</main></div></body></html>
